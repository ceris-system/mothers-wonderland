<div id="printableArea" style="color: #000; background: #fff; padding: 12px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; min-height: 100%; font-family: 'Roboto Mono', monospace;">
    <div style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #000; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" alt="Logo" style="height: 55px; width: auto; object-fit: contain;" onerror="this.style.display='none';">
            <h2 style="margin: 0; font-size: 1.3rem; letter-spacing: 1px; font-weight: 800;">PURCHASE ORDER FORM</h2>
        </div>
        <div style="display: flex; gap: 25px; align-items: flex-end; flex-wrap: wrap; flex-shrink: 0;">
            <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;">
                <label for="serialNoDisplay" style="font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;">NO.:</label>
                <input type="text" id="serialNoDisplay" class="po-serial-display" readonly style="border: none; border-bottom: 1.5px solid #000; background: transparent; font-family: inherit; font-weight: 700; font-size: 0.95rem; padding: 2px 4px; width: 230px; min-width: 230px; box-sizing: border-box;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;">
                <label for="formattedDateDisplay" style="font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;">DATE:</label>
                <input type="text" id="formattedDateDisplay" readonly style="border: none; border-bottom: 1.5px solid #000; background: transparent; font-family: inherit; font-weight: 700; font-size: 0.95rem; padding: 2px 4px; width: 230px; min-width: 230px; box-sizing: border-box;">
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
        <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px;">
            <label for="outletSearch" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;">DEPARTMENT:</label>
            <input type="text" id="outletSearch" list="outletList" placeholder="Search department" autocomplete="off" style="border: none; border-bottom: 1.5px solid #000; background: transparent; font-family: inherit; font-size: 0.9rem; padding: 6px 4px;">
            <datalist id="outletList"></datalist>
        </div>
        <div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: 4px;">
            <label for="requestedBy" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;">REQUESTED BY:</label>
            <input type="text" id="requestedBy" list="outletList" placeholder="Search requesting department" autocomplete="off" style="border: none; border-bottom: 1.5px solid #000; background: transparent; font-family: inherit; font-size: 0.9rem; padding: 6px 4px;">
        </div>
    </div>

    <div class="no-print" style="margin-bottom: 12px;">
        <button type="button" id="productListBtn" class="btn-3d" onclick="openPurchaseOrderProductListModal()" style="padding: 10px 18px; border-radius: 8px; border: 1.5px solid #000; background: #90a8a8; color: #111; font-family: inherit; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; cursor: pointer;">
            <i class="fa-solid fa-plus" style="margin-right: 8px;"></i>ADD PRODUCT
        </button>
    </div>

    <div id="formNotificationBanner" class="no-print" style="display: none; margin-bottom: 10px; padding: 10px 14px; border: 1.5px solid #0d6efd; background: #e7f1ff; color: #0d47a1; font-size: 0.78rem; font-weight: 700; text-transform: uppercase;"></div>

    <div style="flex: 1; max-height: 480px; min-height: 160px; overflow: auto; border: 1px solid #000;">
        <table style="width: 100%; min-width: 820px; table-layout: fixed; border-collapse: collapse; font-family: inherit; font-size: 0.78rem;">
            <thead>
                <tr style="background: #e9ecef;">
                    <th style="width: 7%; padding: 8px; border: 1px solid #000;">SKU</th>
                    <th style="width: 22%; padding: 8px; border: 1px solid #000;">DESCRIPTION</th>
                    <th style="width: 5%; padding: 8px; border: 1px solid #000;">UOM</th>
                    <th style="width: 8%; padding: 8px; border: 1px solid #000;">EXP DATE</th>
                    <th style="width: 6%; padding: 8px; border: 1px solid #000;">QTY ON HAND</th>
                    <th style="width: 6%; padding: 8px; border: 1px solid #000;">TOTAL ON HAND</th>
                    <th style="width: 6%; padding: 8px; border: 1px solid #000;">COST</th>
                    <th style="width: 6%; padding: 8px; border: 1px solid #000;">SRP</th>
                    <th style="width: 6%; padding: 8px; border: 1px solid #000;">QTY</th>
                    <th style="width: 14%; padding: 8px; border: 1px solid #000;">REMARKS</th>
                    <th style="width: 14%; padding: 8px; border: 1px solid #000;">SUPPLIER</th>
                </tr>
            </thead>
            <tbody id="poTableBody"></tbody>
        </table>
    </div>

    <div class="no-print" style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 12px;">
        <button type="button" id="workflowActionBtn" onclick="handleWorkflowAction()" class="btn-3d" style="padding: 12px 24px; border: none; background: #28a745; color: #fff; font-family: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-transform: uppercase;">
            SUBMIT
        </button>
        <button type="button" id="printFormBtn" onclick="triggerPrintForm()" class="btn-3d" style="display: none; padding: 12px 24px; border: none; background: #444; color: #fff; font-family: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-transform: uppercase;">
            PRINT FORM
        </button>
    </div>

    <div id="formSignatureBlock" style="margin-top: 28px; display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 20px;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div style="font-weight: bold; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 45px;">RELEASED BY</div>
            <div style="width: 100%; border-bottom: 1.5px solid #000; margin-bottom: 6px;"></div>
            <div style="font-weight: bold; font-size: 0.7rem; text-transform: uppercase;">SIGNATURE OVER PRINTED NAME</div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div id="approvedSignatureSlot" style="width: 100%; min-height: 165px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;"></div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div style="font-weight: bold; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 45px;">RECEIVED BY</div>
            <div style="width: 100%; border-bottom: 1.5px solid #000; margin-bottom: 6px;"></div>
            <div style="font-weight: bold; font-size: 0.7rem; text-transform: uppercase;">SIGNATURE OVER PRINTED NAME</div>
        </div>
    </div>
</div>

<div id="productListModal" style="display: none; position: fixed; inset: 0; z-index: 4000; justify-content: center; align-items: center; box-sizing: border-box; padding: 20px; background: rgba(0, 0, 0, 0.7);">
    <div style="background: #fff; width: 100%; max-width: 1000px; height: 85vh; border: 2px solid #000; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; font-family: 'Roboto Mono', monospace; color: #000;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 id="productListModalTitle" style="margin: 0; font-size: 1rem; text-transform: uppercase;">SELECT PRODUCT</h3>
            <button type="button" class="app-close-btn" onclick="closeProductListModal()" title="Close product list" aria-label="Close product list" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer;">
                <i class="fa-solid fa-xmark" aria-hidden="true" style="font-size: 1rem;"></i>
            </button>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="productSearchFilter" oninput="filterProductList()" placeholder="Filter SKU or description" style="flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #000; font-family: inherit;">
            <button type="button" onclick="addSelectedProducts()" style="padding: 8px 16px; background: #111; color: #fff; border: none; font-family: inherit; font-weight: bold;">ADD</button>
        </div>
        <div style="flex: 1; overflow: auto; min-height: 0; border: 1px solid #000;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.8rem;">
                <thead>
                    <tr style="position: sticky; top: 0; background: #000; color: #fff; text-align: left;">
                        <th style="padding: 8px; width: 40px; text-align: center;"><input type="checkbox" id="selectAllProducts" aria-label="Select all products"></th>
                        <th style="padding: 8px;">SKU CODE</th>
                        <th style="padding: 8px;">PRODUCT DESCRIPTION</th>
                        <th style="padding: 8px; text-align: center;">UOM</th>
                        <th style="padding: 8px; text-align: center;">EXPIRATION DATE</th>
                        <th style="padding: 8px; text-align: center;">QTY ON HAND</th>
                        <th style="padding: 8px; text-align: center;">TOTAL QTY ON HAND</th>
                    </tr>
                </thead>
                <tbody id="productListTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="customAlertModal" class="no-print" style="display: none; position: fixed; inset: 0; z-index: 5000; justify-content: center; align-items: center; box-sizing: border-box; padding: 20px; background: rgba(0, 0, 0, 0.7);">
    <div style="background: #fff; width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; font-family: 'Roboto Mono', monospace; color: #000;">
        <h3 style="margin: 0 0 15px; color: #d9534f; font-size: 1rem;">ATTENTION</h3>
        <div id="customAlertMessage" style="font-size: 0.85rem; line-height: 1.4; margin-bottom: 20px;"></div>
        <div style="display: flex; justify-content: flex-end;">
            <button type="button" onclick="closeCustomAlert()" style="padding: 6px 18px; background: #000; color: #fff; border: none; font-family: inherit; font-weight: bold;">OK</button>
        </div>
    </div>
</div>
