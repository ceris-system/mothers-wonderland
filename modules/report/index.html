<div style="width: 100%; height: 100%; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; position: relative;">
    
    <!-- Module Header -->
    <div style="margin-bottom: 35px; border-bottom: 1px solid rgba(0, 0, 0, 0.2); padding-bottom: 15px; position: relative;">
        <h2 style="color: #111; margin: 0; font-family: 'Roboto Mono', monospace; font-size: 1.3rem; letter-spacing: 2px; font-weight: 700;">
            <i class="fa-solid fa-chart-line" style="margin-right: 10px; color: #111;"></i>REPORTS SYSTEM
        </h2>
        <div style="position: absolute; top: -5px; right: 0; z-index: 10;">
            <button onclick="backToDashboard()" style="background: transparent; border: none; color: #ff4d4d; font-size: 1.8rem; cursor: pointer; padding: 5px; line-height: 1; display: flex; align-items: center; justify-content: center;" title="Close">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Category Grid Navigation -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 20px; margin: auto 0;">
        <div style="display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 900px;">
            <button class="nav-icon-btn" onclick="window.openInventoryModal()" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; min-height: 100px; border-radius: 12px; cursor: pointer; background: rgba(144, 168, 168, 0.35); border: 1.5px solid rgba(0, 0, 0, 0.4); color: #111; backdrop-filter: blur(10px); transition: all 0.3s ease;">
                <i class="fa-solid fa-boxes-stacked" style="font-size: 1.8rem; color: #111;"></i>
                <span style="font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; letter-spacing: 1px;">
                    
                </span>
            </button>

            <button class="nav-icon-btn" onclick="selectReportCategory('RTV')" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; min-height: 100px; border-radius: 12px; cursor: pointer; background: rgba(144, 168, 168, 0.35); border: 1.5px solid rgba(0, 0, 0, 0.4); color: #111; backdrop-filter: blur(10px); transition: all 0.3s ease;">
                <i class="fa-solid fa-rotate-left" style="font-size: 1.8rem; color: #111;"></i>
                <span style="font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; letter-spacing: 1px;">RTV HISTORY</span>
            </button>

            <button class="nav-icon-btn" onclick="selectReportCategory('REQUEST_RELEASED')" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; min-height: 100px; border-radius: 12px; cursor: pointer; background: rgba(144, 168, 168, 0.35); border: 1.5px solid rgba(0, 0, 0, 0.4); color: #111; backdrop-filter: blur(10px); transition: all 0.3s ease;">
                <i class="fa-solid fa-file-invoice" style="font-size: 1.8rem; color: #111;"></i>
                <span style="font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; letter-spacing: 1px;">REQUEST & RELEASED HISTORY</span>
            </button>
        </div>

        <div style="display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 590px;">
            <button class="nav-icon-btn" onclick="selectReportCategory('TRANSFER')" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; min-height: 100px; border-radius: 12px; cursor: pointer; background: rgba(144, 168, 168, 0.35); border: 1.5px solid rgba(0, 0, 0, 0.4); color: #111; backdrop-filter: blur(10px); transition: all 0.3s ease;">
                <i class="fa-solid fa-right-left" style="font-size: 1.8rem; color: #111;"></i>
                <span style="font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; letter-spacing: 1px;">TRANSFER HISTORY</span>
            </button>

            <button class="nav-icon-btn" onclick="selectReportCategory('PULL_OUT')" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; min-height: 100px; border-radius: 12px; cursor: pointer; background: rgba(144, 168, 168, 0.35); border: 1.5px solid rgba(0, 0, 0, 0.4); color: #111; backdrop-filter: blur(10px); transition: all 0.3s ease;">
                <i class="fa-solid fa-file-arrow-down" style="font-size: 1.8rem; color: #111;"></i>
                <span style="font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; letter-spacing: 1px;">PULL OUT</span>
            </button>

            <button class="nav-icon-btn" onclick="selectReportCategory('SUMMARY')" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; min-height: 100px; border-radius: 12px; cursor: pointer; background: rgba(144, 168, 168, 0.35); border: 1.5px solid rgba(0, 0, 0, 0.4); color: #111; backdrop-filter: blur(10px); transition: all 0.3s ease;">
                <i class="fa-solid fa-chart-pie" style="font-size: 1.8rem; color: #111;"></i>
                <span style="font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; letter-spacing: 1px;">SUMMARY REPORT</span>
            </button>
        </div>
    </div>
</div>
